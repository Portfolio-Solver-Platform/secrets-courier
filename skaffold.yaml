apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: secrets-courier-skaffold

profiles:
  - name: dev
    activation:
      - command: dev
    deploy:
      helm:
        releases:
          - name: secrets-courier
            chartPath: helm/
            namespace: secrets-courier

  - name: prod
    deploy:
      helm:
        releases:
          - name: secrets-courier
            chartPath: helm/
            namespace: secrets-courier
            wait: true
            upgradeOnChange: true

